# @package _group_
_target_: models.mask4former_camera.Mask4Former3D_Camera
_recursive_: false

# backbone (LiDAR — unchanged from base model)
backbone:
  _target_: models.Res16UNet34C
  config:
    dialations: [ 1, 1, 1, 1 ]
    conv1_kernel_size: 5
    bn_momentum: 0.02
  in_channels: ${data.in_channels}
  out_channels: ${data.num_labels}

# camera branch
img_size: [192, 640]    # (H, W) — images are resized to this before encoding

# transformer parameters (same as base)
num_queries: 100
num_heads: 8
num_decoders: 3
num_levels: 4
sample_sizes: [4000, 8000, 16000, 32000]
mask_dim: 128
dim_feedforward: 1024
num_labels: ${data.num_labels}
