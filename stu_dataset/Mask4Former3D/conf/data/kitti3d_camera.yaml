# @package _group_
# Extends kitti3d.yaml with camera image settings.

train_mode: train
validation_mode: valid
test_mode: test

ignore_label: 255
add_distance: true
in_channels: 2
num_labels: 19
instance_population: ${general.instance_population}
sweep: 1
min_stuff_cls_id: 9
min_points: 50
class_names: ['car', 'bicycle', 'motorcycle', 'truck', 'other-vehicle', 'person',
              'bicyclist', 'motorcyclist', 'road', 'parking', 'sidewalk',
              'other-ground', 'building', 'fence', 'vegetation', 'trunk',
              'terrain', 'pole', 'traffic-sign']

# camera image resolution fed to the image backbone
img_size: [192, 640]    # (H, W)

# data loader
pin_memory: true
num_workers: 4           # reduced because each worker now also loads images
batch_size: 2
test_batch_size: 2

# collation
voxel_size: 0.05

base_path: ./data
