general:
  mode: "train"
  seed: null
  ckpt_path: null
  project_name: mask4former3d_camera
  workspace: null
  instance_population: 20
  dbscan_eps: null
  experiment_name: ${now:%Y-%m-%d_%H%M%S}
  save_dir: saved/${general.experiment_name}
  gpus: 2

defaults:
  - data: kitti3d_camera
  - data/data_loaders: simple_loader
  - data/datasets: semantic_kitti_206_camera
  - data/collation_functions: voxelize_collate_camera
  - logging: full
  - model: mask4former3d_camera
  - optimizer: adamw
  - scheduler: onecyclelr
  - trainer: trainer30
  - callbacks: callbacks_panoptic3d
  - matcher: hungarian_matcher
  - loss: set_criterion
  - metric: pq

hydra:
  run:
    dir: saved/hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: saved/hydra_logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.id}
