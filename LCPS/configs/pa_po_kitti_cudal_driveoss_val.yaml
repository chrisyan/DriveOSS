dataset:
    name: SemanticKitti
    version: null
    path: "../data/semantickitti" 
    rotate_aug: True
    flip_aug: True
    max_volume_space: [ 50, 3.1415926, 3 ]
    min_volume_space: [ 0, -3.1415926, -5 ]
    gt_generator:
        sigma: 5
    grid_size: [480,360,32]
    num_worker: 2
    min_points: 50
model:
    pix_fusion: False
    pix_fusion_path: "../checkpoints/resnet18-5c106cde.pth"
    use_sara: False
    monocular : False
    use_att: True
    # checkpoint
    model_load_path: ""
    val_batch_size: 2
    post_proc:
        threshold: 0.1
        nms_kernel: 5
        top_k: 100