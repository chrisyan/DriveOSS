dataset:
    name: SemanticKitti
    version: null
    path: ../data/semantickitti
    rotate_aug: True
    flip_aug: True
    max_volume_space: [ 50, 3.1415926, 3 ]
    min_volume_space: [ 0, -3.1415926, -5 ]
    gt_generator:
        sigma: 5
    grid_size: [480,360,32]
    inst_aug:
        if_use: False
        aug_type: contmix
        # inst_pkl_path: ../data/SemanticKitti/instance_path.pkl 
        inst_pkl_path: null 
        inst_trans: True # random translation for contmix
        inst_rotate: True
        inst_flip: True
        inst_add: True
    num_worker: 2
    min_points: 50 #  https://github.com/zhangzw12319/lcps/blob/main/docs/QA.md
model:
    pix_fusion: False 
    pix_fusion_path: null
    monocular : False # for training with single image
    use_sara: False
    use_att: False
    model_load_path: null
    model_save_path: kitti.pth
    train_batch_size: 2
    val_batch_size: 2
    learning_rate: 0.004
    LR_MILESTONES: [100, 150,200]
    LR_GAMMA: 0.5
    check_iter: 4000
    max_epoch: 30 
    post_proc:
        threshold: 0.1
        nms_kernel: 5
        top_k: 100
    center_loss: MSE
    offset_loss: L1
    center_loss_weight: 100
    offset_loss_weight: 10